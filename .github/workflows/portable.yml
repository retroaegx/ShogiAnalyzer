name: Native portable packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app_paths.py'
      - 'external_process.py'
      - 'https_client.py'
      - 'installer/**'
      - 'server/**'
      - 'tools/*portable*'
      - 'tools/*cleanroom*'
      - 'tools/probe_https.py'
      - 'tools/pyinstaller_hooks/**'
      - 'docs/THIRD_PARTY.md'
      - 'tests/**'
      - '.github/workflows/portable.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep the toolchain aligned with the reviewed VS 2022 REDIST terms.
          - runner: windows-2022
            platform: windows-amd64
            executable: ShogiAnalyzer.exe
          - runner: ubuntu-22.04
            platform: linux-amd64
            executable: ShogiAnalyzer
          - runner: macos-15-intel
            platform: macos-amd64
            executable: ShogiAnalyzer
          - runner: macos-15
            platform: macos-arm64
            executable: ShogiAnalyzer
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/requirements-portable.txt -r tests/requirements.txt
      - run: python -m unittest discover -s tests -p "test_*.py"
      - run: node --test tests/test_*.mjs
      - run: python tools/build_portable.py
      - run: python tools/check_portable_licenses.py dist/portable/app/ShogiAnalyzer/${{ matrix.executable }}
      - run: python tools/smoke_portable.py dist/portable/app/ShogiAnalyzer/${{ matrix.executable }}
      - run: ./dist/portable/app/ShogiAnalyzer/${{ matrix.executable }} --engine-python tools/probe_https.py --output dist/portable/https-probe.json
      - uses: actions/upload-artifact@v4
        with:
          name: ShogiAnalyzer-${{ matrix.platform }}
          path: |
            dist/portable/ShogiAnalyzer-v*.zip
            dist/portable/ShogiAnalyzer-v*.tar.gz
            dist/portable/build-report.json
            dist/portable/build-requirements.lock
            dist/portable/https-probe.json
          if-no-files-found: error

  clean-linux:
    name: Clean Ubuntu without Python
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ShogiAnalyzer-linux-amd64
          path: dist/cleanroom-input
      - name: Test in fresh Ubuntu base container
        run: |
          mkdir -p dist/cleanroom-results
          docker pull ubuntu:22.04
          docker image inspect ubuntu:22.04 --format '{{json .RepoDigests}}' > dist/cleanroom-results/image-digest.json
          docker run --rm --network none --read-only --memory 768m --cpus 2 --pids-limit 128 \
            --tmpfs /tmp:rw,size=512m --tmpfs /test:rw,exec,size=256m \
            -v "$PWD/dist/cleanroom-input:/input:ro" \
            -v "$PWD/dist/cleanroom-results:/results:rw" \
            -v "$PWD/tools/cleanroom_probe.py:/probe.py:ro" \
            -v "$PWD/tools/linux_cleanroom.sh:/run-test.sh:ro" \
            -v "$PWD/tests/fake_usi.py:/peer.py:ro" \
            -v "$PWD/tests/fixtures/promoted_silver.kif:/fixture.kif:ro" \
            ubuntu:22.04 sh /run-test.sh
      - name: Verify HTTPS in fresh Ubuntu without system CA packages
        run: |
          mkdir -p dist/cleanroom-results/https
          docker run --rm --read-only --memory 768m --cpus 2 --pids-limit 128 \
            --tmpfs /tmp:rw,size=512m --tmpfs /test:rw,exec,size=256m \
            -v "$PWD/dist/cleanroom-input:/input:ro" \
            -v "$PWD/dist/cleanroom-results/https:/results:rw" \
            -v "$PWD/tools/probe_https.py:/https-probe.py:ro" \
            -v "$PWD/tools/linux_cleanroom.sh:/run-test.sh:ro" \
            ubuntu:22.04 sh /run-test.sh https
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ShogiAnalyzer-clean-linux-report
          # Keep the disposable DB/auth secrets out of the report artifact.
          path: |
            dist/cleanroom-results/*.txt
            dist/cleanroom-results/*.json
            dist/cleanroom-results/*.log
            dist/cleanroom-results/https/*.txt
            dist/cleanroom-results/https/*.json
          if-no-files-found: error
