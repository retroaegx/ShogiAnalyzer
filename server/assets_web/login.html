<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0e11">
  <title>ログイン — Shogi Analyzer</title>
  <!-- app install (PWA) / icons -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=2">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png?v=2">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ShogiAnalyzer">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <style>
    :root { color-scheme: dark; --bg: #0b0c0f; --surface: #14161b; --line: rgba(255,255,255,.13); --text: #eceef2; --muted: #9aa1ad; --accent: #e3b25a; --accent-2: #f2cc85; --bad: #f2767a; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
      background: radial-gradient(900px 600px at 30% -10%, rgba(227,178,90,.08), transparent 60%), var(--bg);
      color: var(--text); font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif; }
    form { width: min(360px, 100%); padding: 28px 26px 24px; border-radius: 18px; background: var(--surface);
      border: 1px solid var(--line); box-shadow: 0 30px 70px -20px rgba(0,0,0,.85); display: flex; flex-direction: column; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
    .mark { width: 30px; height: 30px; display: grid; place-items: center; padding-top: 4px; font-weight: 800; color: #1b1405;
      background: linear-gradient(145deg, var(--accent-2), var(--accent)); clip-path: polygon(50% 0, 88% 16%, 100% 100%, 0 100%, 12% 16%); }
    h1 { margin: 2px 0 0; font-size: 16px; }
    p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--muted); }
    input { width: 100%; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--text); font-size: 16px; }
    input:focus { outline: none; border-color: rgba(227,178,90,.6); }
    #code { letter-spacing: .3em; font-variant-numeric: tabular-nums; }
    button { height: 44px; margin-top: 4px; border: 0; border-radius: 10px; background: var(--accent); color: #1b1405; font-size: 15px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    .err { min-height: 18px; color: var(--bad); font-size: 13px; }
  </style>
</head>
<body>
  <form id="f" autocomplete="on">
    <div class="brand"><span class="mark">将</span>Shogi Analyzer</div>
    <h1 id="title">ログイン</h1>
    <p id="lead">パスワードを入力してください。</p>
    <label id="codeRow" hidden>セットアップコード（起動したコンソール / console.log に表示）
      <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000">
    </label>
    <label>パスワード
      <input id="pw" type="password" autocomplete="current-password" required>
    </label>
    <label id="pw2Row" hidden>パスワード（確認）
      <input id="pw2" type="password" autocomplete="new-password">
    </label>
    <div class="err" id="err"></div>
    <button id="go" type="submit">ログイン</button>
  </form>
  <script>
    const $ = (id) => document.getElementById(id);
    let setup = false;

    async function init() {
      const st = await fetch("/api/auth/status", { cache: "no-store" }).then((r) => r.json());
      if (!st.required || st.logged_in) return location.replace("/");
      setup = !st.configured;
      if (setup) {
        // first connection after SHOGI_ANALYZER_PASSWORD=TRUE: choose the password
        $("title").textContent = "パスワードの設定";
        $("lead").innerHTML = `パスワード保護が有効になりました。これから使うパスワードを決めてください（${st.min_length} 文字以上）。<br>設定後、この端末・このアドレスでは ${st.days} 日間入力不要です。`;
        $("pw").autocomplete = "new-password";
        $("pw2Row").hidden = false;
        $("pw2").required = true;
        $("codeRow").hidden = !st.setup_needs_code;
        $("code").required = st.setup_needs_code;
        $("go").textContent = "設定して開く";
        (st.setup_needs_code ? $("code") : $("pw")).focus();
      } else {
        $("lead").textContent = `パスワードを入力してください。一度入力すると、この端末・このアドレスでは ${st.days} 日間入力不要です。`;
        $("pw").focus();
      }
    }

    $("f").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("err").textContent = "";
      if (setup && $("pw").value !== $("pw2").value) {
        $("err").textContent = "確認用のパスワードが一致しません";
        return;
      }
      $("go").disabled = true;
      try {
        const body = setup ? { password: $("pw").value, code: $("code").value } : { password: $("pw").value };
        const res = await fetch(setup ? "/api/auth/setup" : "/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const j = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(j.detail || `エラー (${res.status})`);
        location.replace("/");
      } catch (x) {
        $("err").textContent = x.message;
        $("pw").select();
      } finally {
        $("go").disabled = false;
      }
    });

    init().catch((x) => ($("err").textContent = String(x)));
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
  </script>
</body>
</html>
